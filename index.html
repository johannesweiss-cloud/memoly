<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>memoly</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Outfit:wght@300;400;500&amp;display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --bg: #f7f7f5;
      --card-bg: #f0f0ee;
      --border: #e2e2de;
      --text: #111111;
      --muted: #888880;
      --radius: 28px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 110px;
    }

    .hero {
      background: var(--white);
      padding: 60px 28px 48px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .hero-tag {
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      display: block;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .hero h1 em {
      font-style: italic;
      font-weight: 400;
    }

    .hero-sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 28px 20px 10px;
    }

    .date-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 14px;
    }

    .date-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow .2s;
    }

    .date-card:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, .06);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      gap: 12px;
    }

    .card-header-left {
      flex: 1;
      min-width: 0;
    }

    .card-num {
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .card-desc-preview {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .card-thumb {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: var(--muted);
      transition: transform .25s ease;
      flex-shrink: 0;
    }

    .date-card.open .chevron {
      transform: rotate(180deg);
    }

    .card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s cubic-bezier(.4, 0, .2, 1);
    }

    .date-card.open .card-body {
      max-height: 700px;
    }

    .card-body-inner {
      padding: 0 18px 20px;
      border-top: 1px solid var(--border);
    }

    .card-desc-full {
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
      padding-top: 14px;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .img-zone {
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s;
      background: var(--bg);
    }

    .img-zone:hover {
      border-color: var(--muted);
    }

    .img-zone-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 20px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .img-zone-placeholder svg {
      opacity: .35;
    }

    .img-zone-preview {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
    }

    .img-zone-hint {
      font-size: 11px;
      text-align: center;
      color: var(--muted);
      padding: 7px;
      background: rgba(0, 0, 0, .03);
    }

    .add-btn-wrap {
      padding: 10px 14px 0;
    }

    .add-btn {
      width: 100%;
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 17px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color .2s, color .2s;
    }

    .add-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .extra-section {
      padding: 28px 14px 0;
    }

    .extra-label {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .extra-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .extra-slot {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .extra-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background .2s;
    }

    .extra-delete:hover {
      background: rgba(255, 77, 77, 0.9);
    }

    .date-delete-btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: none;
      border: 1px solid rgba(255, 77, 77, 0.4);
      border-radius: 12px;
      color: #ff4d4d;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }

    .date-delete-btn:hover {
      background: rgba(255, 77, 77, 0.08);
    }

    .extra-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .extra-add {
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      background: var(--white);
      transition: border-color .2s, color .2s;
    }

    .extra-add:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(247, 247, 245, .95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 16px 24px;
      z-index: 200;
    }

    .export-btn {
      width: 100%;
      background: var(--text);
      color: var(--white);
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s;
    }

    .export-btn:hover {
      opacity: .85;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-sheet {
      background: var(--white);
      border-radius: 24px 24px 0 0;
      padding: 24px 22px 44px;
      width: 100%;
      max-width: 430px;
      animation: slideUp .3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 22px;
    }

    .modal-sheet h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .field-label {
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      margin-bottom: 14px;
      -webkit-appearance: none;
    }

    .field-input:focus {
      border-color: var(--text);
    }

    textarea.field-input {
      resize: none;
      min-height: 86px;
      line-height: 1.55;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-cancel {
      padding: 13px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-save {
      flex: 1;
      padding: 13px;
      background: var(--text);
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      cursor: pointer;
    }

    .setup-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity .2s;
      z-index: 100;
    }

    .setup-btn:hover {
      opacity: 1;
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 600;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      text-align: center;
      gap: 12px;
      z-index: 800;
    }

    .error-state.hidden {
      display: none;
    }

    .error-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
    }

    .error-state p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .error-state-btn {
      margin-top: 8px;
      padding: 13px 28px;
      background: var(--text);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .share-btn {
      width: 100%;
      background: var(--white);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: background .2s;
    }

    .share-btn:hover {
      background: var(--card-bg);
    }

    .share-btn.hidden {
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 48px 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <button class="setup-btn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
      </path>
    </svg>
  </button>

  <div class="hero">
    <span class="hero-tag" id="hero-tag-text"></span>
    <h1><span id="hero-title-line1"></span><br><em id="hero-title-highlight"></em></h1>
    <p class="hero-sub" id="hero-sub-text"></p>
  </div>

  <div class="section-label">Unsere Dates</div>
  <div class="date-list" id="date-list"></div>

  <div class="add-btn-wrap">
    <button class="add-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Neues Date hinzufügen
    </button>
  </div>

  <div class="extra-section">
    <div class="extra-label">Weitere Bilder</div>
    <div class="extra-grid" id="extra-grid"></div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <button class="share-btn hidden" id="share-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Link kopieren
    </button>
    <button class="export-btn" type="button">Als Erinnerung exportieren ↓</button>
  </div>

  <div class="modal-overlay hidden" id="modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3>Neues Date</h3>
      <label class="field-label">Titel</label>
      <input class="field-input" type="text" id="new-title" placeholder="z.B. Tretboot fahren…" autocomplete="off">
      <label class="field-label">Beschreibung</label>
      <textarea class="field-input" id="new-desc" placeholder="Was erwartet uns dort?"></textarea>
      <div class="modal-actions">
        <button class="modal-cancel" id="modal-cancel-btn" type="button">Abbrechen</button>
        <button class="modal-save" id="modal-save-btn" type="button">Hinzufügen</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="setup-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3>App Setup</h3>
      <label class="field-label">Tag (z.B. Amsterdam · 2026)</label>
      <input class="field-input" type="text" id="setup-tag" autocomplete="off">
      <label class="field-label">Titel Zeile 1 (z.B. Alles Gute zum)</label>
      <input class="field-input" type="text" id="setup-title1" autocomplete="off">
      <label class="field-label">Titel Highlight (z.B. Geburtstag, Schatzi!)</label>
      <input class="field-input" type="text" id="setup-title-highlight" autocomplete="off">
      <label class="field-label">Untertitel</label>
      <input class="field-input" type="text" id="setup-sub" autocomplete="off">
      <div class="modal-actions">
        <button class="modal-cancel" id="setup-cancel-btn" type="button">Abbrechen</button>
        <button class="modal-save" id="setup-save-btn" type="button">Event erstellen</button>
      </div>
    </div>
  </div>

  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="error-state hidden" id="error-state">
    <h2>Event nicht gefunden</h2>
    <p>Dieser Link ist ungültig oder das Event wurde gelöscht.</p>
    <button class="error-state-btn" onclick="window.location.hash = '#/'">Neues Event erstellen</button>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
