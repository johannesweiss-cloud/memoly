<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>memoly — Halte deine Ausflüge fest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/logo.png" />

<style>
  :root{
    --bg:#efeae0;
    --bg-soft:#f5f1e8;
    --card:#fdfbf6;
    --ink:#1a1815;
    --ink-2:#3a352e;
    --mute:#98948c;
    --line:#d9d3c7;
    --line-soft:#e6e0d3;
    --accent:#1a1815; /* monochrome by default */
    --serif:'Instrument Serif', 'Fraunces', 'Times New Roman', serif;
    --sans:'Geist', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    --mono:'Geist Mono', ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  img{display:block;max-width:100%}
  ::selection{background:var(--ink);color:var(--bg)}

  /* Layout helpers */
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px}
  .row{display:flex}
  .col{display:flex;flex-direction:column}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
  .display{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:.95}
  .display em{font-style:italic;font-weight:400;font-family:var(--serif)}
  .body-l{font-size:18px;line-height:1.5;color:var(--ink-2)}
  .body-m{font-size:15px;line-height:1.55;color:var(--ink-2)}
  .small{font-size:13px;color:var(--mute)}

  /* Reveal animation */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .reveal.d1{transition-delay:.06s}.reveal.d2{transition-delay:.12s}
  .reveal.d3{transition-delay:.18s}.reveal.d4{transition-delay:.24s}
  .reveal.d5{transition-delay:.30s}.reveal.d6{transition-delay:.36s}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:48px;padding:0 22px;border-radius:999px;font-size:14px;font-weight:500;
    letter-spacing:.005em;transition:all .25s ease;white-space:nowrap}
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:#000;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(0,0,0,.04);border-color:var(--ink)}
  .btn-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;
    border-bottom:1px solid var(--ink);padding-bottom:2px;line-height:1}
  .btn-link:hover{opacity:.6}

  /* Dashed pill (like in app reference) */
  .pill-dashed{display:inline-flex;align-items:center;gap:8px;
    border:1px dashed var(--line);color:var(--mute);
    height:44px;padding:0 20px;border-radius:999px;font-size:14px;
    background:transparent;width:100%;justify-content:center}

  /* Mockup card */
  .mock{background:var(--card);border-radius:24px;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -20px rgba(40,30,15,.18), 0 12px 24px -12px rgba(40,30,15,.10);
    overflow:hidden}
  .mock-pad{padding:22px}
  .mock-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-align:center;font-weight:500}
  .mock-title{font-family:var(--serif);font-size:34px;text-align:center;line-height:1;margin:8px 0 6px}
  .mock-sub{text-align:center;color:var(--mute);font-size:13px}

  /* utility */
  .hr{height:1px;background:var(--line-soft);width:100%}
  .vhr{width:1px;background:var(--line-soft)}

  /* Hide tweaks-only chrome when not active */
  body[data-tweaks="off"] .tweaks-only{display:none}

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none}
  }

  /* Responsive grid helpers — override inline styles with !important */
  @media (max-width:768px){
    .lp-nav-links{display:none !important}
    .lp-login-link{display:none !important}
    .lp-grid-2,.lp-grid-3,.lp-grid-4{grid-template-columns:1fr !important}
    .lp-grid-faq{grid-template-columns:1fr !important;gap:40px !important}
    /* Sticky FAQ-Überschrift auf Mobile abschalten — sonst klebt sie oben und
       die FAQ-Liste scrollt darüber (Überlappung) */
    .lp-grid-faq > div:first-child{position:static !important}
    .lp-grid-split{grid-template-columns:1fr !important}
    .lp-grid-footer{grid-template-columns:1fr 1fr !important;gap:24px !important}
    .lp-hero-comp{display:none !important}
    .lp-hero-sub{flex-direction:column !important;align-items:flex-start !important;gap:20px !important}
    .wrap{padding:0 18px}
  }
  @media (min-width:769px) and (max-width:1024px){
    .lp-grid-4{grid-template-columns:repeat(2,1fr) !important}
    .lp-grid-footer{grid-template-columns:repeat(2,1fr) !important}
  }
</style>
</head>
<body data-tweaks="off">

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
  const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
  window.supabaseClient = createClient(supabaseUrl, supabaseKey);
</script>

<script type="text/babel" src="/tweaks-panel.jsx"></script>
<script type="text/babel" src="/mockup.jsx"></script>
<script type="text/babel" src="/sections.jsx"></script>
<script type="text/babel" src="/app.jsx"></script>

</body>
</html>
